<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quel jour sommes-nous ?</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #fafafa;
            font-family: Arial, sans-serif;
            color: #111;
        }

        .container {
            text-align: center;
        }

        .accent {
            width: 45px;
            height: 4px;
            background-color: #e00000;
            margin: 0 auto 25px;
        }

        h1 {
            font-size: 42px;
            font-weight: 600;
            margin-bottom: 30px;
        }

        input {
            width: 280px;
            padding: 15px 18px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 17px;
            text-align: center;
            outline: none;
        }

        input:focus {
            border-color: #e00000;
            box-shadow: 0 0 0 2px rgba(224, 0, 0, 0.1);
        }

        button {
            display: block;
            margin: 18px auto 0;
            padding: 13px 30px;
            background-color: #e00000;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background-color: #b80000;
        }
    </style>
</head>

<body>

    <main class="container">
        <div class="accent"></div>

        <h1>Quel jour sommes-nous ?</h1>

        <input 
            type="text" 
            placeholder="Ex. Lundi"
            aria-label="Quel jour sommes-nous ?"
        >

        <button>Continuer</button>
    </main>

</body>
</html>
:::
